/**:  
  controller_manager:
    ros__parameters:
      update_rate: 1000
      use_sim_time: true

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      effort_controller:
        type: effort_controllers/JointGroupEffortController

  joint_state_broadcaster:
    ros__parameters:
      publish_rate: 50

  effort_controller:
    ros__parameters:
      joints:
        - front_right_servo_corpus_joint
        - front_right_leg1_corpus_joint
        - front_right_leg1_leg2_joint
        - front_left_servo_corpus_joint
        - front_left_leg1_corpus_joint
        - front_left_leg1_leg2_joint
        - back_right_servo_corpus_joint
        - back_right_leg1_corpus_joint
        - back_right_leg1_leg2_joint
        - back_left_servo_corpus_joint
        - back_left_leg1_corpus_joint
        - back_left_leg1_leg2_joint
      state_interfaces:
        - position
        - velocity
        - effort
      command_interfaces:
        - effort
